name: test

on:
  push:
    branches: [main]
  pull_request:

env:
  BUN_VERSION: 1.3.14
  RAILPACK_VERSION: 0.39.0
  BUILDKIT_IMAGE: moby/buildkit:v0.33.0

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun install --cwd web --frozen-lockfile
      - run: bun test
      - run: bunx tsc --noEmit
      - run: bunx tsc --noEmit
        working-directory: web
      - run: bun run --cwd web build

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Railpack
        run: curl -sSL https://railpack.com/install.sh | RAILPACK_VERSION=${{ env.RAILPACK_VERSION }} sh
      - name: Start BuildKit
        run: |
          docker run --rm --privileged --detach --name buildkit ${{ env.BUILDKIT_IMAGE }}
          docker exec buildkit buildctl debug workers
      - name: Build bot image
        run: railpack build --name jev-bot .
        env:
          BUILDKIT_HOST: docker-container://buildkit
      - name: Build dashboard image
        run: railpack build --name jev-web web
        env:
          BUILDKIT_HOST: docker-container://buildkit

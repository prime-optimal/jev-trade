name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install inference dependencies
        run: bun install --frozen-lockfile
      - name: Install browser dependencies
        run: bun install --frozen-lockfile
        working-directory: web
      - name: Test inference and browser contracts
        run: bun run test
      - name: Typecheck inference service
        run: bunx tsc --noEmit
      - name: Typecheck dashboard
        run: bunx tsc --noEmit
        working-directory: web

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install dashboard dependencies
        run: bun install --frozen-lockfile
        working-directory: web
      - name: Build dashboard
        run: bun run build
        working-directory: web
